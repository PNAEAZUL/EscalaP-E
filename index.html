<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Gestão de Escalas</title>
                <script src="https://cdn.tailwindcss.com"></script>
                </head>
                <body class="bg-gray-100 p-4 md:p-8">
                    <div class="max-w-6xl mx-auto bg-white p-6 rounded shadow">
                            <h1 class="text-2xl font-bold mb-6 text-gray-800">Gerenciador de Escalas</h1>
                                    
                                            <!-- Seleção de Data -->
                                                    <div class="flex flex-col md:flex-row gap-4 mb-6">
                                                                <input type="date" id="dataEscala" class="border p-2 rounded w-full md:w-auto">
                                                                            <button onclick="liberarColagem()" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 transition">Carregar / Visualizar</button>
                                                                                    </div>

                                                                                            <!-- Área de Colagem -->
                                                                                                    <div id="areaColagem" class="hidden border-t pt-6 mb-6">
                                                                                                                <h2 class="font-semibold mb-2">Cole os dados do ISA:</h2>
                                                                                                                            <textarea id="textoIsa" class="w-full h-40 border p-2 rounded mb-4 text-xs font-mono" placeholder="Cole aqui os dados brutos..."></textarea>
                                                                                                                                        <button onclick="processarIsa()" class="bg-green-600 text-white px-6 py-2 rounded hover:bg-green-700 transition">Processar Escala</button>
                                                                                                                                                </div>

                                                                                                                                                        <!-- Tabela -->
                                                                                                                                                                <div class="overflow-x-auto mt-6">
                                                                                                                                                                            <table class="w-full border-collapse text-sm">
                                                                                                                                                                                            <thead>
                                                                                                                                                                                                                <tr class="bg-gray-200">
                                                                                                                                                                                                                                        <th class="border p-2">Voo Chegada</th>
                                                                                                                                                                                                                                                                <th class="border p-2">ETA</th>
                                                                                                                                                                                                                                                                                        <th class="border p-2">Voo Saída</th>
                                                                                                                                                                                                                                                                                                                <th class="border p-2">Rampa</th>
                                                                                                                                                                                                                                                                                                                                        <th class="border p-2">Emb 1</th>
                                                                                                                                                                                                                                                                                                                                                                <th class="border p-2">Emb 2</th>
                                                                                                                                                                                                                                                                                                                                                                                    </tr>
                                                                                                                                                                                                                                                                                                                                                                                                    </thead>
                                                                                                                                                                                                                                                                                                                                                                                                                    <tbody id="tabelaVoos">
                                                                                                                                                                                                                                                                                                                                                                                                                                        <tr>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                <td colspan="6" class="text-center p-4 text-gray-500">Nenhum dado processado ainda.</td>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </tr>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </tbody>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </table>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        function liberarColagem() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const data = document.getElementById('dataEscala').value;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (!data) return alert("Por favor, selecione uma data.");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById('areaColagem').classList.remove('hidden');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            function processarIsa() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const texto = document.getElementById('textoIsa').value;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (!texto) return alert("Cole os dados do ISA primeiro!");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const linhas = texto.split('\n');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const listaVoos = [];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    // Simulação do motor de leitura do texto colado
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                linhas.forEach(linha => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (linha.includes("PR-") || linha.includes("PS-") || linha.includes("PP-")) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    // Extração básica de exemplo baseada no padrão do seu print
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const partes = linha.trim().split(/\s+/);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (partes.length >= 4) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    listaVoos.push({
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                chegada: partes[0] + " " + partes[1],
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            eta: partes[4] || "--:--",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        saida: partes[7] ? partes[6] + " " + partes[7] : "HANGAR"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (listaVoos.length === 0) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            // Fallback de teste caso queira testar a tabela visualmente com os dados que você colou
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            listaVoos.push(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                { chegada: "PR-AUE 6053", eta: "10:15", saida: "PR-YSN 4004" },
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    { chegada: "PS-AEE 6037", eta: "10:35", saida: "PS-AEA 6414" },
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        { chegada: "PS-AEY 6041", eta: "10:45", saida: "HANGAR" }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        );
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                renderizarTabela(listaVoos);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                function renderizarTabela(voos) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const tbody = document.getElementById('tabelaVoos');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        tbody.innerHTML = "";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    voos.forEach((voo, index) => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const tr = document.createElement('tr');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    tr.innerHTML = `
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <td class="border p-2 text-center font-bold">${voo.chegada}</td>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <td class="border p-2 text-center">${voo.eta}</td>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <td class="border p-2 text-center">${voo.saida}</td>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <td class="border p-2 text-center"><input type="text" class="border p-1 w-full rounded" placeholder="Nome Rampa"></td>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <td class="border p-2 text-center"><input type="text" class="border p-1 w-full rounded" placeholder="Nome Emb 1"></td>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <td class="border p-2 text-center"><input type="text" class="border p-1 w-full rounded" placeholder="Nome Emb 2"></td>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            `;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            tbody.appendChild(tr);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </html>
