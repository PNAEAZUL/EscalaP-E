<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Gestão de Escalas</title>
                <script src="https://cdn.tailwindcss.com"></script>
                </head>
                <body class="bg-gray-100 p-4 md:p-8">
                    <div class="max-w-6xl mx-auto bg-white p-6 rounded shadow">
                            <h1 class="text-2xl font-bold mb-6 text-gray-800">Gerenciador de Escalas</h1>
                                    
                                            <!-- Seleção de Data -->
                                                    <div class="flex flex-col md:flex-row gap-4 mb-6">
                                                                <input type="date" id="dataEscala" class="border p-2 rounded w-full md:w-auto" onchange="mudarData()">
                                                                            <button onclick="liberarColagem()" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 transition">Carregar / Visualizar</button>
                                                                                    </div>

                                                                                            <!-- Área de Colagem -->
                                                                                                    <div id="areaColagem" class="hidden border-t pt-6 mb-6">
                                                                                                                <h2 class="font-semibold mb-2">Cole os dados copiados da planilha aqui:</h2>
                                                                                                                            <textarea id="textoIsa" class="w-full h-32 border p-2 rounded mb-4 text-xs font-mono" placeholder="Cole aqui..."></textarea>
                                                                                                                                        <button onclick="processarIsa()" class="bg-green-600 text-white px-6 py-2 rounded hover:bg-green-700 transition">Processar Escala</button>
                                                                                                                                                </div>

                                                                                                                                                        <!-- Tabela -->
                                                                                                                                                                <div class="overflow-x-auto mt-6">
                                                                                                                                                                            <table class="w-full border-collapse text-sm">
                                                                                                                                                                                            <thead>
                                                                                                                                                                                                                <tr class="bg-gray-200">
                                                                                                                                                                                                                                        <th class="border p-2">Voo Chegada</th>
                                                                                                                                                                                                                                                                <th class="border p-2">ETA</th>
                                                                                                                                                                                                                                                                                        <th class="border p-2">Voo Saída</th>
                                                                                                                                                                                                                                                                                                                <th class="border p-2">STD</th>
                                                                                                                                                                                                                                                                                                                                        <th class="border p-2">Rampa</th>
                                                                                                                                                                                                                                                                                                                                                                <th class="border p-2">Emb 1</th>
                                                                                                                                                                                                                                                                                                                                                                                        <th class="border p-2">Emb 2</th>
                                                                                                                                                                                                                                                                                                                                                                                                            </tr>
                                                                                                                                                                                                                                                                                                                                                                                                                            </thead>
                                                                                                                                                                                                                                                                                                                                                                                                                                            <tbody id="tabelaVoos">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                <tr>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <td colspan="7" class="text-center p-4 text-gray-500">Selecione a data e clique em Carregar / Visualizar.</td>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </tr>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </tbody>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </table>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                let voosGlobais = [];

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        function mudarData() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById('textoIsa').value = "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById('areaColagem').classList.add('hidden');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById('tabelaVoos').innerHTML = `<tr><td colspan="7" class="text-center p-4 text-gray-500">Data alterada. Cole a malha e processe.</td></tr>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        voosGlobais = [];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        function liberarColagem() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (!document.getElementById('dataEscala').value) return alert("Selecione uma data.");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById('areaColagem').classList.remove('hidden');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                function ehHora(t) { return t && /^\d{2}:\d{2}$/.test(t.trim()); }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        function processarIsa() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const texto = document.getElementById('textoIsa').value;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (!texto) return alert("Cole os dados primeiro!");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const linhas = texto.split('\n');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const chegadas = [], saidas = [];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                linhas.forEach(l => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (!l.trim()) return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const c = l.split('\t');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (c.length >= 10 && (c[0]?.startsWith("PR-") || c[0]?.startsWith("PS-"))) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    // Chegada
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        let pCheg = c[0].trim(), vCheg = c[1]?.trim() || "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            let eta = "--:--";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                for (let i = 2; i < 9; i++) { if (ehHora(c[i])) { eta = c[i].trim(); break; } }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (pCheg && vCheg) chegadas.push({ pref: pCheg, voo: `${pCheg} ${vCheg}`, horario: eta });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        // Saída
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            let pSaid = "", vSaid = "", idxSaid = -1;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                for (let i = 8; i < c.length; i++) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        let val = c[i]?.trim() || "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (val.startsWith("PR-") || val.startsWith("PS-")) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            pSaid = val; vSaid = c[i+1]?.trim() || ""; idxSaid = i; break;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            let std = "--:--";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (idxSaid !== -1) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        for (let i = idxSaid + 2; i < c.length; i++) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (ehHora(c[i])) { std = c[i].trim(); break; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (pSaid && vSaid) saidas.push({ pref: pSaid, voo: `${pSaid} ${vSaid}`, horario: std });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            chegadas.sort((a, b) => a.horario.localeCompare(b.horario));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const listaFinal = [];

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    saidas.forEach(s => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    let validos = chegadas.filter(ch => ch.pref === s.pref && ch.horario <= s.horario);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    let chegVoo = "HANGAR", etaVoo = "--:--";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (validos.length > 0) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        let esc = validos[validos.length - 1];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            chegVoo = esc.voo; etaVoo = esc.horario;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                let idx = chegadas.indexOf(esc);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (idx > -1) chegadas.splice(idx, 1);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    listaFinal.push({ chegada: chegVoo, eta: etaVoo, saida: s.voo, std: s.horario });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            listaFinal.sort((a, b) => (a.std === "--:--" ? 1 : b.std === "--:--" ? -1 : a.std.localeCompare(b.std)));

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (listaFinal.length === 0) return alert("Nenhum voo válido encontrado.");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    voosGlobais = listaFinal;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                renderizarTabela();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                function renderizarTabela() {
