<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Gestão de Escalas</title>
                <script src="https://cdn.tailwindcss.com"></script>
                </head>
                <body class="bg-gray-100 p-4 md:p-8">
                    <div class="max-w-6xl mx-auto bg-white p-6 rounded shadow">
                            <h1 class="text-2xl font-bold mb-6 text-gray-800">Gerenciador de Escalas</h1>
                                    
                                            <!-- Seleção de Data -->
                                                    <div class="flex flex-col md:flex-row gap-4 mb-6">
                                                                <input type="date" id="dataEscala" class="border p-2 rounded w-full md:w-auto">
                                                                            <button onclick="liberarColagem()" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 transition">Carregar / Visualizar</button>
                                                                                    </div>

                                                                                            <!-- Área de Colagem -->
                                                                                                    <div id="areaColagem" class="hidden border-t pt-6 mb-6">
                                                                                                                <h2 class="font-semibold mb-2">Cole os dados copiados da planilha aqui:</h2>
                                                                                                                            <textarea id="textoIsa" class="w-full h-40 border p-2 rounded mb-4 text-xs font-mono" placeholder="Cole aqui..."></textarea>
                                                                                                                                        <button onclick="processarIsa()" class="bg-green-600 text-white px-6 py-2 rounded hover:bg-green-700 transition">Processar Escala</button>
                                                                                                                                                </div>

                                                                                                                                                        <!-- Tabela -->
                                                                                                                                                                <div class="overflow-x-auto mt-6">
                                                                                                                                                                            <table class="w-full border-collapse text-sm">
                                                                                                                                                                                            <thead>
                                                                                                                                                                                                                <tr class="bg-gray-200">
                                                                                                                                                                                                                                        <th class="border p-2">Voo Chegada</th>
                                                                                                                                                                                                                                                                <th class="border p-2">ETA</th>
                                                                                                                                                                                                                                                                                        <th class="border p-2">Voo Saída</th>
                                                                                                                                                                                                                                                                                                                <th class="border p-2">STD</th>
                                                                                                                                                                                                                                                                                                                                        <th class="border p-2">Rampa</th>
                                                                                                                                                                                                                                                                                                                                                                <th class="border p-2">Emb 1</th>
                                                                                                                                                                                                                                                                                                                                                                                        <th class="border p-2">Emb 2</th>
                                                                                                                                                                                                                                                                                                                                                                                                            </tr>
                                                                                                                                                                                                                                                                                                                                                                                                                            </thead>
                                                                                                                                                                                                                                                                                                                                                                                                                                            <tbody id="tabelaVoos">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                <tr>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <td colspan="7" class="text-center p-4 text-gray-500">Nenhum dado processado ainda.</td>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </tr>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </tbody>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </table>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                function liberarColagem() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const data = document.getElementById('dataEscala').value;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (!data) return alert("Por favor, selecione uma data.");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById('areaColagem').classList.remove('hidden');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    function processarIsa() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const texto = document.getElementById('textoIsa').value;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (!texto) return alert("Cole os dados primeiro!");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const linhas = texto.split('\n');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const listaVoos = [];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            linhas.forEach(linha => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (linha.trim() === "") return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const colunas = linha.split('\t');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            // Filtro blindado: só processa se a coluna 0 começar com PR- ou PS- (ignora cabeçalhos e lixo)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (colunas.length >= 14 && (colunas[0].startsWith("PR-") || colunas[0].startsWith("PS-"))) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                let prefChegada = colunas[0].trim();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    let vooChegadaNum = colunas[1] ? colunas[1].trim() : "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        let eta = colunas[5] ? colunas[5].trim() : "--:--";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                let prefSaida = colunas[9] ? colunas[9].trim() : "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    let vooSaidaNum = colunas[10] ? colunas[10].trim() : "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        let std = colunas[13] ? colunas[13].trim() : "--:--"; // Ajustado para a coluna 13 correta do STD

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            let chegadaCompleta = `${prefChegada} ${vooChegadaNum}`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                let saidaCompleta = (prefSaida && vooSaidaNum) ? `${prefSaida} ${vooSaidaNum}` : "HANGAR";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    listaVoos.push({
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            chegada: chegadaCompleta,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    eta: eta,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            saida: saidaCompleta,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    std: std
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (listaVoos.length === 0) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                alert("Nenhum voo válido encontrado. Verifique se copiou as linhas corretas da planilha.");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        renderizarTabela(listaVoos);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        function renderizarTabela(voos) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const tbody = document.getElementById('tabelaVoos');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                tbody.innerHTML = "";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            voos.forEach((voo) => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const tr = document.createElement('tr');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            tr.innerHTML = `
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <td class="border p-2 text-center font-bold">${voo.chegada}</td>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <td class="border p-2 text-center">${voo.eta}</td>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <td class="border p-2 text-center font-semibold text-blue-700">${voo.saida}</td>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <td class="border p-2 text-center">${voo.std}</td>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <td class="border p-2 text-center"><input type="text" class="border p-1 w-full rounded" placeholder="Rampa"></td>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <td class="border p-2 text-center"><input type="text" class="border p-1 w-full rounded" placeholder="Emb 1"></td>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <td class="border p-2 text-center"><input type="text" class="border p-1 w-full rounded" placeholder="Emb 2"></td>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        `;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        tbody.appendChild(tr);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </html>
