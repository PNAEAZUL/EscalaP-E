<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestão de Escalas - Diagnóstico</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 md:p-8">
<div class="max-w-6xl mx-auto bg-white p-6 rounded shadow">
<h1 class="text-2xl font-bold text-gray-800 mb-6">Diagnóstico de Escala (Modo Local)</h1>
<div class="flex flex-col md:flex-row gap-4 mb-6">
<input type="date" id="dataEscala" value="2026-08-23" class="border p-2 rounded w-full md:w-auto" onchange="mudarData()">
<button onclick="carregarExemplo()" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 transition">Carregar Dados de Exemplo</button>
</div>
<div class="overflow-x-auto mt-6">
<table class="w-full border-collapse text-sm">
<thead>
<tr class="bg-gray-200">
<th class="border p-2">Voo Chegada</th><th class="border p-2">ETA</th><th class="border p-2">Voo Saída</th>
<th class="border p-2">STD</th><th class="border p-2">Rampa</th><th class="border p-2">Emb 1</th><th class="border p-2">Emb 2</th>
</tr>
</thead>
<tbody id="tabelaVoos">
<tr><td colspan="7" class="text-center p-4 text-gray-500">Selecione a data ou clique em carregar exemplo.</td></tr>
</tbody>
</table>
</div>
</div>
<script>
let voosGlobais = [
      { chegada: "HANGAR", eta: "--:--", saida: "PS-ADL 2454", std: "06:00" },
        { chegada: "HANGAR", eta: "--:--", saida: "PR-YRB 2442", std: "06:00" },
          { chegada: "PR-YRU 4716", eta: "06:50", saida: "PR-YRU 4004", std: "07:40" },
            { chegada: "PS-FGE 6010", eta: "07:45", saida: "PS-FGE 2232", std: "08:55" }
];

function mudarData() {
      renderizarTabela();
}

function carregarExemplo() {
      renderizarTabela();
        alert("Dados carregados com sucesso!");
}

function renderizarTabela() {
      const tbody = document.getElementById('tabelaVoos');
        tbody.innerHTML = "";
          
            voosGlobais.forEach((v) => {
                    let isH = v.chegada === "HANGAR";
                        tbody.innerHTML += `<tr>
                              <td class="border p-2 text-center ${isH ? 'font-bold text-amber-600' : 'font-bold'}">${v.chegada}</td>
                                    <td class="border p-2 text-center">${v.eta}</td>
                                          <td class="border p-2 text-center font-semibold text-blue-700">${v.saida}</td>
                                                <td class="border p-2 text-center font-semibold text-green-700">${v.std}</td>
                                                      <td class="border p-2 text-center text-gray-400 italic">Clique para preencher</td>
                                                            <td class="border p-2 text-center text-gray-400 italic">Clique para preencher</td>
                                                                  <td class="border p-2 text-center text-gray-400 italic">Clique para preencher</td>
                                                                      </tr>`;
            });
}
// Executa ao abrir
window.onload = mudarData;
</script>
</body>
</html>

            })
}
}
}
]
