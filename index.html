<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Gestão de Escalas</title>
                <script src="https://cdn.tailwindcss.com"></script>
                </head>
                <body class="bg-gray-100 p-4 md:p-8">
                    <div class="max-w-6xl mx-auto bg-white p-6 rounded shadow">
                            <h1 class="text-2xl font-bold mb-6 text-gray-800">Gerenciador de Escalas</h1>
                                    
                                            <!-- Seleção de Data -->
                                                    <div class="flex flex-col md:flex-row gap-4 mb-6">
                                                                <input type="date" id="dataEscala" class="border p-2 rounded w-full md:w-auto">
                                                                            <button onclick="carregarDados()" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 transition">Carregar / Visualizar</button>
                                                                                    </div>

                                                                                            <!-- Área de Colagem (aparece se não houver dados) -->
                                                                                                    <div id="areaColagem" class="hidden border-t pt-6">
                                                                                                                <h2 class="font-semibold mb-2">Colar dados do ISA:</h2>
                                                                                                                            <textarea id="textoIsa" class="w-full h-40 border p-2 rounded mb-4" placeholder="Cole aqui os dados brutos da planilha..."></textarea>
                                                                                                                                        <button onclick="processarIsa()" class="bg-green-600 text-white px-6 py-2 rounded hover:bg-green-700 transition">Processar e Salvar Escala</button>
                                                                                                                                                </div>

                                                                                                                                                        <!-- Tabela -->
                                                                                                                                                                <div class="overflow-x-auto mt-6">
                                                                                                                                                                            <table class="w-full border-collapse text-sm">
                                                                                                                                                                                            <thead>
                                                                                                                                                                                                                <tr class="bg-gray-200">
                                                                                                                                                                                                                                        <th class="border p-2">Voo Chegada</th>
                                                                                                                                                                                                                                                                <th class="border p-2">ETA</th>
                                                                                                                                                                                                                                                                                        <th class="border p-2">Voo Saída</th>
                                                                                                                                                                                                                                                                                                                <th class="border p-2">Rampa</th>
                                                                                                                                                                                                                                                                                                                                        <th class="border p-2">Emb 1</th>
                                                                                                                                                                                                                                                                                                                                                                <th class="border p-2">Emb 2</th>
                                                                                                                                                                                                                                                                                                                                                                                    </tr>
                                                                                                                                                                                                                                                                                                                                                                                                    </thead>
                                                                                                                                                                                                                                                                                                                                                                                                                    <tbody id="tabelaVoos">
                                                                                                                                                                                                                                                                                                                                                                                                                                        <!-- Linhas aparecerão aqui -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                        </tbody>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </table>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            function carregarDados() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const data = document.getElementById('dataEscala').value;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (!data) return alert("Por favor, selecione uma data.");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            // Aqui é onde o sistema verificará no Supabase se há dados
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById('areaColagem').classList.remove('hidden');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    console.log("Buscando dados para: " + data);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    function processarIsa() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const texto = document.getElementById('textoIsa').value;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (!texto) return alert("Cole os dados primeiro!");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        alert("Dados processados com sucesso! (Integrando com o Supabase em breve)");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </html>
