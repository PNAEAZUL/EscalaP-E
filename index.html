<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Gestão de Escalas - Nuvem</title>
                <script src="https://cdn.tailwindcss.com"></script>
                    <!-- SDK do Supabase -->
                        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
                        </head>
                        <body class="bg-gray-100 p-4 md:p-8">
                            <div class="max-w-6xl mx-auto bg-white p-6 rounded shadow">
                                    <h1 class="text-2xl font-bold mb-6 text-gray-800">Gerenciador de Escalas (Nuvem)</h1>
                                            
                                                    <!-- Seleção de Data -->
                                                            <div class="flex flex-col md:flex-row gap-4 mb-6">
                                                                        <input type="date" id="dataEscala" class="border p-2 rounded w-full md:w-auto" onchange="mudarData()">
                                                                                    <button onclick="liberarColagem()" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 transition">Carregar / Visualizar</button>
                                                                                            </div>

                                                                                                    <!-- Área de Colagem -->
                                                                                                            <div id="areaColagem" class="hidden border-t pt-6 mb-6">
                                                                                                                        <h2 class="font-semibold mb-2">Cole os dados copiados da planilha aqui:</h2>
                                                                                                                                    <textarea id="textoIsa" class="w-full h-32 border p-2 rounded mb-4 text-xs font-mono" placeholder="Cole aqui..."></textarea>
                                                                                                                                                <button onclick="processarSalvarIsa()" class="bg-green-600 text-white px-6 py-2 rounded hover:bg-green-700 transition">Processar e Salvar Escala na Nuvem</button>
                                                                                                                                                        </div>

                                                                                                                                                                <!-- Tabela -->
                                                                                                                                                                        <div class="overflow-x-auto mt-6">
                                                                                                                                                                                    <table class="w-full border-collapse text-sm">
                                                                                                                                                                                                    <thead>
                                                                                                                                                                                                                        <tr class="bg-gray-200">
                                                                                                                                                                                                                                                <th class="border p-2">Voo Chegada</th>
                                                                                                                                                                                                                                                                        <th class="border p-2">ETA</th>
                                                                                                                                                                                                                                                                                                <th class="border p-2">Voo Saída</th>
                                                                                                                                                                                                                                                                                                                        <th class="border p-2">STD</th>
                                                                                                                                                                                                                                                                                                                                                <th class="border p-2">Rampa</th>
                                                                                                                                                                                                                                                                                                                                                                        <th class="border p-2">Emb 1</th>
                                                                                                                                                                                                                                                                                                                                                                                                <th class="border p-2">Emb 2</th>
                                                                                                                                                                                                                                                                                                                                                                                                                    </tr>
                                                                                                                                                                                                                                                                                                                                                                                                                                    </thead>
                                                                                                                                                                                                                                                                                                                                                                                                                                                    <tbody id="tabelaVoos">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <tr>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <td colspan="7" class="text-center p-4 text-gray-500">Selecione a data e clique em Carregar / Visualizar.</td>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </tr>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </tbody>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </table>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        // --- CONFIGURAÇÃO DO SUPABASE ---
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const SUPABASE_URL = 'SUA_URL_AQUI';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const SUPABASE_ANON_KEY = 'SUA_KEY_AQUI';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        // ---------------------------------

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                let voosGlobais = [];

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        async function mudarData() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const dataSel = document.getElementById('dataEscala').value;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById('areaColagem').classList.add('hidden');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (!dataSel) return;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    // Busca a malha salva no Supabase para esta data
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const { data: malha, error } = await supabase
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                .from('malha_isa')
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                .select('texto_bruto')
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                .eq('data_escala', dataSel)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                .maybeSingle();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (malha && malha.texto_bruto) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById('textoIsa').value = malha.texto_bruto;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            processarTextoIsa(malha.texto_bruto, false);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById('textoIsa').value = "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        voosGlobais = [];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById('tabelaVoos').innerHTML = `<tr><td colspan="7" class="text-center p-4 text-gray-500">Nenhuma malha para esta data. Clique em Carregar / Visualizar e cole os dados.</td></tr>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    function liberarColagem() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (!document.getElementById('dataEscala').value) return alert("Selecione uma data primeiro.");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById('areaColagem').classList.remove('hidden');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            function ehHora(t) { return t && /^\d{2}:\d{2}$/.test(t.trim()); }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    async function processarSalvarIsa() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const texto = document.getElementById('textoIsa').value;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (!texto) return alert("Cole os dados primeiro!");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const dataSel = document.getElementById('dataEscala').value;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (!dataSel) return alert("Selecione uma data.");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                // Salva a malha no Supabase vinculada à data
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const { error } = await supabase
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            .from('malha_isa')
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            .upsert({ data_escala: dataSel, texto_bruto: texto }, { onConflict: 'data_escala' });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (error) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        console.error(error);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        return alert("Erro ao salvar a malha no Supabase.");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                processarTextoIsa(texto, true);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                function processarTextoIsa(texto, mostrarAlerta = true) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const linhas = texto.split('\n');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const chegadas = [], saidas = [];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                linhas.forEach(l => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (!l.trim()) return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const c = l.split('\t');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (c.length >= 10 && (c[0]?.startsWith("PR-") || c[0]?.startsWith("PS-"))) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    let pCheg = c[0].trim(), vCheg = c[1]?.trim() || "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        let eta = "--:--";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            for (let i = 2; i < 9; i++) { if (ehHora(c[i])) { eta = c[i].trim(); break; } }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (pCheg && vCheg) chegadas.push({ pref: pCheg, voo: `${pCheg} ${vCheg}`, horario: eta });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    let pSaid = "", vSaid = "", idxSaid = -1;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        for (let i = 8; i < c.length; i++) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                let val = c[i]?.trim() || "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (val.startsWith("PR-") || val.startsWith("PS-")) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    pSaid = val; vSaid = c[i+1]?.trim() || ""; idxSaid = i; break;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    let std = "--:--";
