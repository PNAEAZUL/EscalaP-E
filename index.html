                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            let div = cel.querySelector('div'), input = cel.querySelector('input'), voo = cel.getAttribute('data-v'), campo = cel.getAttribute('data-c');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                div.addEventListener('click', async () => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      let listaTrincas = window.listaTrincasDia || [];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            let opcoesTxt = listaTrincas.map((t, i) => `${i + 1} - R:${t.rampa} | E1:${t.emb_1} | E2:${t.emb_2}`).join('\n');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  let msg = "Digite o número da trinca ou escreva o NOME LIVRE que deseja:";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (opcoesTxt) msg += "\n\nTrincas usadas:\n" + opcoesTxt;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              let escolha = prompt(msg);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (escolha === null) return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          escolha = escolha.trim();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (!escolha) return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const sb = getSupabase(), dataSel = document.getElementById('dataEscala').value, linha = cel.closest('tr');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            let rVal = linha.querySelector('[data-c="rampa"] input').value || linha.querySelector('[data-c="rampa"] div').textContent.replace(' ⚠️', '');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  let e1Val = linha.querySelector('[data-c="emb_1"] input').value || linha.querySelector('[data-c="emb_1"] div').textContent.replace(' ⚠️', '');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        let e2Val = linha.querySelector('[data-c="emb_2"] input').value || linha.querySelector('[data-c="emb_2"] div').textContent.replace(' ⚠️', '');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              if(rVal === "Clique para preencher") rVal = "";
