<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestão de Escalas - Nuvem</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-gray-100 p-4 md:p-8">
<div id="conteudoParaPDF" class="max-w-6xl mx-auto bg-white p-6 rounded shadow">
<h1 class="text-2xl font-bold mb-6 text-gray-800">Gerenciador de Escalas</h1>
<div class="flex flex-col md:flex-row gap-4 mb-6 print:hidden">
<input type="date" id="dataEscala" class="border p-2 rounded w-full md:w-auto" onchange="mudarData()">
<button onclick="liberarColagem()" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 transition">Carregar / Visualizar</button>
<button onclick="gerarPDF()" class="bg-purple-600 text-white px-6 py-2 rounded hover:bg-purple-700 transition">Compartilhar Escala (PDF)</button>
</div>
<div id="areaColagem" class="hidden border-t pt-6 mb-6">
<h2 class="font-semibold mb-2">Cole os dados copiados da planilha aqui:</h2>
<textarea id="textoIsa" class="w-full h-32 border p-2 rounded mb-4 text-xs font-mono" placeholder="Cole aqui..."></textarea>
<button onclick="processarSalvarIsa()" class="bg-green-600 text-white px-6 py-2 rounded hover:bg-green-700 transition">Processar e Salvar Escala</button>
</div>
<div class="overflow-x-auto mt-6">
<table class="w-full border-collapse text-sm">
<thead>
<tr class="bg-gray-200">
<th class="border p-2">Voo Chegada</th><th class="border p-2">ETA</th><th class="border p-2">Voo Saída</th>
<th class="border p-2">STD</th><th class="border p-2">Rampa</th><th class="border p-2">Emb 1</th><th class="border p-2">Emb 2</th>
</tr>
</thead>
<tbody id="tabelaVoos">
<tr><td colspan="7" class="text-center p-4 text-gray-500">Selecione a data e clique em Carregar / Visualizar.</td></tr>
</tbody>
</table>
</div>
</div>
<script>
const SUPABASE_URL='https://dzfamogbogonwxgdpvbl.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_50Zeo1eoWIT7SJxvfA2W7A_N4Ls46kO';
let supabaseClient=null,voosGlobais=[];
function getSupabase(){if(!supabaseClient&&window.supabase)supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);return supabaseClient;}
function gerarPDF(){html2pdf().set({margin:[0.5,0.5,0.5,0.5],filename:`Escala_${document.getElementById('dataEscala').value||'Data'}.pdf`,image:{type:'jpeg',quality:0.98},html2canvas:{scale:2,useCORS:true},jsPDF:{unit:'in',format:'letter',orientation:'landscape'}}).from(document.getElementById('conteudoParaPDF')).save();}
async function mudarData(){
  const dataSel=document.getElementById('dataEscala').value;
    document.getElementById('areaColagem').classList.add('hidden');
      if(!dataSel)return;
        const sb=getSupabase();
          let malhaSalva=null;
            if(sb){const{data}=await sb.from('malha_isa').select('texto_bruto').eq('data_escala',dataSel).maybeSingle();if(data)malhaSalva=data.texto_bruto;}
              if(!malhaSalva)malhaSalva=localStorage.getItem(`malha_${dataSel}`);
                if(malhaSalva){document.getElementById('textoIsa').value=malhaSalva;processarTextoIsa(malhaSalva,false);}
                  else{document.getElementById('textoIsa').value="";voosGlobais=[];document.getElementById('tabelaVoos').innerHTML=`<tr><td colspan="7" class="text-center p-4 text-gray-500">Nenhuma malha salva para esta data.</td></tr>`;}
                  }
                  function liberarColagem(){if(!document.getElementById('dataEscala').value)return alert("Selecione uma data primeiro.");document.getElementById('areaColagem').classList.remove('hidden');}
                  function ehHora(t){return t&&/^\d{2}:\d{2}$/.test(t.trim());}
                  function converterMinutos(h){if(!h||h==="--:--")return-1;const p=h.split(':');return p.length!==2?-1:parseInt(p[0])*60+parseInt(p[1]);}
                  async function processarSalvarIsa(){
                    const texto=document.getElementById('textoIsa').value;if(!texto)return alert("Cole os dados primeiro!");
                      const dataSel=document.getElementById('dataEscala').value,sb=getSupabase();
                        if(sb)await sb.from('malha_isa').upsert({data_escala:dataSel,texto_bruto:texto},{onConflict:'data_escala'});
                          localStorage.setItem(`malha_${dataSel}`,texto);processarTextoIsa(texto,true);
                          }
                          function processarTextoIsa(texto,mostrarAlerta=true){
                            const linhas=texto.split('\n'),chegadas=[],saidas=[];
                              linhas.forEach(l=>{
                                  if(!l.trim())return;
                                      if(l.includes("PREFIXO")||l.includes("CHEGADA")||l.includes("SAÍDA")||l.includes("MALHA"))return;
                                          const c=l.split('\t');
                                              for(let i=0;i<c.length;i++){
                                                    let val=c[i]?.trim()||"";
                                                          if((val.startsWith("PR-")||val.startsWith("PS-"))&&i+1<c.length){
                                                                  let pref=val,vooNum=c[i+1]?.trim()||"";
                                                                          if(vooNum && /^\d+$/.test(vooNum)){
                                                                                    let hs=[];
                                                                                              for(let j=0;j<c.length;j++){if(ehHora(c[j]))hs.push(c[j].trim());}
                                                                                                        if(i <= 8){
                                                                                                                    let eta=hs.length>0?hs[0]:"--:--";
                                                                                                                                let minEta=converterMinutos(eta);
                                                                                                                                            if(!chegadas.some(ch=>ch.pref===pref&&ch.voo===`${pref} ${vooNum}`&&ch.min===minEta)){
                                                                                                                                                          chegadas.push({pref,voo:`${pref} ${vooNum}`,horario:eta,min:minEta});
                                                                                                                                                                      }
                                                                                                                                                                                } else {
                                                                                                                                                                                            let std=hs.length>0?hs[hs.length-1]:"--:--";
                                                                                                                                                                                                        let minStd=converterMinutos(std);
                                                                                                                                                                                                                    if(!saidas.some(s=>s.pref===pref&&s.voo===`${pref} ${vooNum}`&&s.min===minStd)){
                                                                                                                                                                                                                                  saidas.push({pref,voo:`${pref} ${vooNum}`,horario:std,min:minStd});
                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                            });
                                                                                                                                                                                                                                                                              saidas.sort((a,b)=>a.min-b.min);chegadas.sort((a,b)=>a.min-b.min);
                                                                                                                                                                                                                                                                                const listaFinal=[];
                                                                                                                                                                                                                                                                                  saidas.forEach(s=>{
                                                                                                                                                                                                                                                                                      let chegVoo="HANGAR",etaVoo="--:--",validos=chegadas.filter(ch=>ch.pref===s.pref&&ch.min<=s.min);
                                                                                                                                                                                                                                                                                          if(validos.length>0){let esc=validos[validos.length-1];chegVoo=esc.voo;etaVoo=esc.horario;let idx=chegadas.indexOf(esc);if(idx!==-1)chegadas.splice(idx,1);}
                                                                                                                                                                                                                                                                                              listaFinal.push({chegada:chegVoo,eta:etaVoo,saida:s.voo,std:s.horario});
                                                                                                                                                                                                                                                                                                });
                                                                                                                                                                                                                                                                                                  listaFinal.sort((a,b)=>{let mA=converterMinutos(a.std),mB=converterMinutos(b.std);return mA===-1?1:mB===-1?-1:mA-mB;});
                                                                                                                                                                                                                                                                                                    voosGlobais=listaFinal;renderizarTabela();if(mostrarAlerta)alert("Escala processada com sucesso!");
                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                    async function renderizarTabela(){
                                                                                                                                                                                                                                                                                                      const tbody=document.getElementById('tabelaVoos');tbody.innerHTML="";
                                                                                                                                                                                                                                                                                                        const dataSel=document.getElementById('dataEscala').value,sb=getSupabase(),mapaOps={};
                                                                                                                                                                                                                                                                                                          const trincasUnicas=new Map();
                                                                                                                                                                                                                                                                                                            if(sb&&dataSel){
                                                                                                                                                                                                                                                                                                                const{data:ops}=await sb.from('escala_operacional').select('*').eq('data_escala',dataSel);
                                                                                                                                                                                                                                                                                                                    ops?.forEach(item=>{
                                                                                                                                                                                                                                                                                                                          if(item.voo_saida) mapaOps[item.voo_saida]=item;
                                                                                                                                                                                                                                                                                                                                if(item.rampa||item.emb_1||item.emb_2){
                                                                                                                                                                                                                                                                                                                                        trincasUnicas.set(`${item.rampa||''}|${item.emb_1||''}|${item.emb_2||''}`,{rampa:item.rampa||'',emb_1:item.emb_1||'',emb_2:item.emb_2||''});
                                                                                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                                                                                                  });
                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                      if(Object.keys(mapaOps).length===0&&dataSel){
                                                                                                                                                                                                                                                                                                                                                          try{
                                                                                                                                                                                                                                                                                                                                                                let loc=JSON.parse(localStorage.getItem(`ops_${dataSel}`)||"{}");
                                                                                                                                                                                                                                                                                                                                                                      if(Array.isArray(loc)){
                                                                                                                                                                                                                                                                                                                                                                              loc.forEach((item, idx)=>{if(voosGlobais[idx]) mapaOps[voosGlobais[idx].saida]=item;});
                                                                                                                                                                                                                                                                                                                                                                                    } else {
                                                                                                                                                                                                                                                                                                                                                                                            Object.assign(mapaOps, loc);
                                                                                                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                                                                                                      }catch(e){}
                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                          window.listaTrincasDia=Array.from(trincasUnicas.values());
                                                                                                                                                                                                                                                                                                                                                                                                            let conflitosPorVoo={};
                                                                                                                                                                                                                                                                                                                                                                                                              if(voosGlobais.length>0){
                                                                                                                                                                                                                                                                                                                                                                                                                  let aloc=voosGlobais.map(v=>{
                                                                                                                                                                                                                                                                                                                                                                                                                        let op=mapaOps[v.saida]||{};
                                                                                                                                                                                                                                                                                                                                                                                                                              return{saida:v.saida,stdMin:converterMinutos(v.std),etaMin:converterMinutos(v.eta),membros:{rampa:op.rampa?op.rampa.trim():"",emb_1:op.emb_1?op.emb_1.trim():"",emb_2:op.emb_2?op.emb_2.trim():""}};
                                                                                                                                                                                                                                                                                                                                                                                                                                  });
                                                                                                                                                                                                                                                                                                                                                                                                                                      for(let i=0;i<aloc.length;i++){
                                                                                                                                                                                                                                                                                                                                                                                                                                            for(let j=i+1;j<aloc.length;j++){
                                                                                                                                                                                                                                                                                                                                                                                                                                                    let v1=aloc[i],v2=aloc[j],haConflito=false;
                                                                                                                                                                                                                                                                                                                                                                                                                                                            if(v1.stdMin!==-1&&v2.etaMin!==-1&&v1.stdMin>v2.etaMin&&v1.stdMin-v2.etaMin<60)haConflito=true;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if(v2.stdMin!==-1&&v1.etaMin!==-1&&v2.stdMin>v1.etaMin&&v2.stdMin-v1.etaMin<60)haConflito=true;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if(haConflito){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      let m1=Object.values(v1.membros).filter(m=>m!==""),m2=Object.values(v2.membros).filter(m=>m!=="");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                m1.filter(m=>m2.includes(m)).forEach(m=>{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            for(let campo in v1.membros){if(v1.membros[campo]===m)conflitosPorVoo[`${v1.saida}|${campo}`]=true;}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        for(let campo in v2.membros){if(v2.membros[campo]===m)conflitosPorVoo[`${v2.saida}|${campo}`]=true;}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if(voosGlobais.length===0){tbody.innerHTML=`<tr><td colspan="7" class="text-center p-4 text-gray-500">Nenhum voo carregado. Selecione a data e clique em Carregar / Visualizar.</td></tr>`;return;}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          voosGlobais.forEach((v)=>{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              let isH=v.chegada==="HANGAR",dadosVoo=mapaOps[v.saida]||{};
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  tbody.innerHTML+=`<tr>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <td class="border p-2 text-center ${isH?'font-bold text-amber-600':'font-bold'}">${v.chegada}</td>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <td class="border p-2 text-center">${v.eta}</td>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <td class="border p-2 text-center font-semibold text-blue-700">${v.saida}</td>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <td class="border p-2 text-center font-semibold text-green-700">${v.std}</td>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <td class="border p-2 text-center celula" data-voo="${v.saida}" data-c="rampa">${gerarCel(dadosVoo.rampa,v.saida,'rampa',conflitosPorVoo)}</td>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <td class="border p-2 text-center celula" data-voo="${v.saida}" data-c="emb_1">${gerarCel(dadosVoo.emb_1,v.saida,'emb_1',conflitosPorVoo)}</td>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <td class="border p-2 text-center celula" data-voo="${v.saida}" data-c="emb_2">${gerarCel(dadosVoo.emb_2,v.saida,'emb_2',conflitosPorVoo)}</td>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </tr>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    ativarEdicao();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    function gerarCel(val,vooSaida,campo,conflitosPorVoo){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      let temC=val&&conflitosPorVoo[`${vooSaida}|${campo}`];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        let cor=temC?'text-red-600 font-bold bg-red-50':(val?'text-gray-800':'text-gray-400 italic');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          let txt=val?val:'Clique para preencher';if(temC)txt+=' ⚠️';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            return`<div class="cursor-pointer py-1 px-2 ${cor} hover:bg-gray-100 rounded select-none text-center">${txt}</div><input type="text" class="border p-1 w-full rounded hidden" value="${val||""}">`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            function ativarEdicao(){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              document.querySelectorAll('.celula').forEach(cel=>{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  let div=cel.querySelector('div'),input=cel.querySelector('input'),vooSaida=cel.getAttribute('data-voo'),campo=cel.getAttribute('data-c');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      div.addEventListener('click',async()=>{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            let listaTrincas=window.listaTrincasDia||[];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  let opcoesTxt=listaTrincas.map((t,i)=>`${i+1} - R:${t.rampa} | E1:${t.emb_1} | E2:${t.emb_2}`).join('\n');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        let msg="Digite o número da trinca ou escreva o NOME LIVRE que deseja:";if(opcoesTxt)msg+="\n\nTrincas usadas:\n"+opcoesTxt;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              let escolha=prompt(msg);if(escolha===null)return;escolha=escolha.trim();if(!escolha)return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    let linha=cel.closest('tr');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          let rVal=linha.querySelector('[data-c="rampa"] input').value||linha.querySelector('[data-c="rampa"] div').textContent.replace(' ⚠️','');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                let e1Val=linha.querySelector('[data-c="emb_1"] input').value||linha.querySelector('[data-c="emb_1"] div').textContent.replace(' ⚠️','');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      let e2Val=linha.querySelector('[data-c="emb_2"] input').value||linha.querySelector('[data-c="emb_2"] div').textContent.replace(' ⚠️','');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if(rVal==="Clique para preencher")rVal="";if(e1Val==="Clique para preencher")e1Val="";if(e2Val==="Clique para preencher")e2Val="";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  if(!isNaN(escolha)&&escolha>0&&escolha<=listaTrincas.length){let t=listaTrincas[escolha-1];rVal=t.rampa;e1Val=t.emb_1;e2Val=t.emb_2;}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        else{if(campo==='rampa')rVal=escolha;if(campo==='emb_1')e1Val=escolha;if(campo==='emb_2')e2Val=escolha;}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              await salvarDadosVoo(vooSaida,rVal,e1Val,e2Val);renderizarTabela();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      div.addEventListener('dblclick',()=>{div.classList.add('hidden');input.classList.remove('hidden');input.focus();});
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          let salvar=async()=>{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                let val=input.value.trim(),linha=cel.closest('tr');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      let rVal=linha.querySelector('[data-c="rampa"] input').value||linha.querySelector('[data-c="rampa"] div').textContent.replace(' ⚠️','');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            let e1Val=linha.querySelector('[data-c="emb_1"] input').value||linha.querySelector('[data-c="emb_1"] div').textContent.replace(' ⚠️','');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  let e2Val=linha.querySelector('[data-c="emb_2"] input').value||linha.querySelector('[data-c="emb_2"] div').textContent.replace(' ⚠️','');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if(rVal==="Clique para preencher")rVal="";if(e1Val==="Clique para preencher")e1Val="";if(e2Val==="Clique para preencher")e2Val="";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              if(campo==='rampa')rVal=val;if(campo==='emb_1')e1Val=val;if(campo==='emb_2')e2Val=val;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    await salvarDadosVoo(vooSaida,rVal,e1Val,e2Val);renderizarTabela();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        };
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            input.addEventListener('blur',salvar);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                input.addEventListener('keydown',e=>{if(e.key==='Enter')salvar();});
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  async function salvarDadosVoo(vooSaida,rVal,e1Val,e2Val){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const dataSel=document.getElementById('dataEscala').value;if(!dataSel)return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const sb=getSupabase();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if(sb)await sb.from('escala_operacional').upsert({data_escala:dataSel,voo_saida:vooSaida,rampa:rVal,emb_1:e1Val,emb_2:e2Val},{onConflict:'data_escala,voo_saida'});
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          let localObj={};
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            try{localObj=JSON.parse(localStorage.getItem(`ops_${dataSel}`)||"{}");if(Array.isArray(localObj))localObj={};}catch(e){}
